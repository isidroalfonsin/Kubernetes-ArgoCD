name: Build and Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'my-app/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: ./my-app
        push: true
        tags: |
          isidroalfonsin/my-app:${{ github.sha }}
          isidroalfonsin/my-app:latest

    - name: Update Kubernetes Deployment
      run: |
        cd my-app/k8s
        sed -i "s|image: isidroalfonsin/my-app:.*|image: isidroalfonsin/my-app:${{ github.sha }}|" deployment.yaml
        
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add deployment.yaml
        git commit -m "Update deployment image to version ${{ github.sha }}"
        git push
